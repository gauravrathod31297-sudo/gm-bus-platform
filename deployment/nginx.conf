server {
    listen 80;
    server_name api.bustracker.gauravmedia.in;
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
server {
    listen 80;
    server_name admin.bustracker.gauravmedia.in;
    location / { proxy_pass http://127.0.0.1:5173; proxy_set_header Host $host; }
}
server {
    listen 80;
    server_name app.bustracker.gauravmedia.in;
    location / { proxy_pass http://127.0.0.1:5174; proxy_set_header Host $host; }
}
